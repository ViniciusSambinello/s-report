name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify tag matches the project version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION=$(grep -oP '(?<=version = ")[^"]+' build.gradle.kts)
          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match build.gradle.kts version $PROJECT_VERSION"
            exit 1
          fi
          echo "VERSION=$PROJECT_VERSION" >> "$GITHUB_ENV"

      - name: Build shaded jars
        run: ./gradlew :s-reports-paper:shadowJar :s-reports-velocity:shadowJar

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            s-reports-paper/build/libs/s-reports-paper-${{ env.VERSION }}.jar
            s-reports-velocity/build/libs/s-reports-velocity-${{ env.VERSION }}.jar
          generate_release_notes: true
